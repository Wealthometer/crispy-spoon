name: Continuous Script Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'

jobs:
  generate-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate random script
        id: generator
        run: |
          TIMESTAMP=$(date '+%Y%m%d-%H%M%S')
          FILENAME="auto-${TIMESTAMP}.js"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          
          CONTENT_TYPE=$((RANDOM % 3))
          
          if [ $CONTENT_TYPE -eq 0 ]; then
            cat <<SCRIPT_EOF > "$FILENAME"
          // Random JavaScript code generated at $(date)
          function randomFunction$(date +%s)() {
              const result = $((RANDOM % 100));
              return result * $((RANDOM % 10));
          }
          console.log(randomFunction$(date +%s)());
          SCRIPT_EOF
          
          elif [ $CONTENT_TYPE -eq 1 ]; then
            cat <<TEXT_EOF > "$FILENAME"
          # Random text generated at $(date)
          This is line $RANDOM of the file.
          Another random line with number: $RANDOM.
          TEXT_EOF
          
          else
            cat <<JSON_EOF > "$FILENAME"
          {
              "id": $RANDOM,
              "timestamp": "$(date -Iseconds)",
              "data": "Random data $RANDOM",
              "value": $RANDOM
          }
          JSON_EOF
          fi
          
          echo "Created file: $FILENAME"
          cat "$FILENAME"

      - name: Commit and push
        run: |
          git config --global user.name "Wealthometer"
          git config --global user.email "wealthhajoh87@gmail.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto-generated file: ${{ steps.generator.outputs.filename }}"
          git push
